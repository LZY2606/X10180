[package]
name = "pointcloud-meridian"
version = "0.1.0"
edition = "2021"
description = "点云经纬 - verifiable LiDAR/GNSS/calibration frame chain"

[[bin]]
name = "pointcloud-meridian"
path = "src/main.rs"

[lib]
name = "pointcloud_meridian"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
