[package]
name = "dianyun-jingwei"
version = "0.1.0"
edition = "2021"
description = "点云经纬 - 按包切分 LiDAR/GNSS 数据的可核验帧链对齐系统"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
nalgebra = "0.33"

[dev-dependencies]
tempfile = "3"
