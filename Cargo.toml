[package]
name = "pointcloud-warp"
version = "0.1.0"
edition = "2021"

[lib]
name = "pointcloud_warp"
path = "src/lib.rs"

[[bin]]
name = "pointcloud-warp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fnv = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
serde_json = "1"
